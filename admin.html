<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ADMIN M4X</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080a0f;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 650px;
      margin: 40px auto;
    }

    .card {
      background: #11151d;
      border: 1px solid #262c38;
      border-radius: 24px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    .sub {
      color: #9299a8;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #b6bdc9;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid #343b49;
      background: #090c11;
      color: white;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: white;
      color: black;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 18px;
      border: 1px solid #343b49;
      border-radius: 14px;
      background: #090c11;
    }

    .key {
      font-size: 20px;
      font-weight: bold;
      word-break: break-all;
      margin: 8px 0;
    }

    .ok {
      color: #73e29a;
    }

    .err {
      color: #ff7676;
    }

    .copy {
      background: #202632;
      color: white;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>ADMIN M4X</h1>
    <div class="sub">Tạo key kích hoạt M4X</div>

    <label>ADMIN TOKEN</label>
    <input
      id="token"
      type="password"
      placeholder="Nhập ADMIN_TOKEN"
      autocomplete="off"
    >

    <label>Thời hạn key</label>
    <select id="days">
      <option value="1">1 ngày</option>
      <option value="7">7 ngày</option>
      <option value="30" selected>30 ngày</option>
      <option value="90">90 ngày</option>
      <option value="365">365 ngày</option>
    </select>

    <button id="create" onclick="createKey()">
      TẠO KEY
    </button>

    <div id="result"></div>

  </div>
</div>

<script>
  const result = document.getElementById("result");
  const createButton = document.getElementById("create");

  async function createKey() {
    const token = document.getElementById("token").value.trim();
    const days = Number(document.getElementById("days").value);

    if (!token) {
      showError("Chưa nhập ADMIN_TOKEN.");
      return;
    }

    createButton.disabled = true;
    createButton.textContent = "ĐANG TẠO...";

    try {
      const response = await fetch("/API/create-key", {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },

        body: JSON.stringify({
          days: days
        })
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("API trả về dữ liệu không hợp lệ.");
      }

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error ||
          ("HTTP " + response.status)
        );
      }

      result.style.display = "block";

      result.innerHTML = `
        <div class="ok">
          ✓ Tạo key thành công
        </div>

        <div class="key" id="generatedKey">
          ${escapeHtml(data.key)}
        </div>

        <div>
          Thời hạn: ${days} ngày
        </div>

        <div>
          Hết hạn:
          ${new Date(data.expires_at * 1000).toLocaleString("vi-VN")}
        </div>

        <button
          class="copy"
          onclick="copyKey()"
        >
          COPY KEY
        </button>
      `;

    } catch (error) {
      showError(error.message);
    } finally {
      createButton.disabled = false;
      createButton.textContent = "TẠO KEY";
    }
  }

  function showError(message) {
    result.style.display = "block";

    result.innerHTML = `
      <div class="err">
        ✕ ${escapeHtml(message)}
      </div>
    `;
  }

  async function copyKey() {
    const element = document.getElementById("generatedKey");

    if (!element) {
      return;
    }

    await navigator.clipboard.writeText(
      element.textContent.trim()
    );

    alert("Đã copy key");
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>

</body>
</html>
